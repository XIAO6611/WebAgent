<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 340px; padding: 15px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #111827; }
    h3 { margin: 0; color: #1f2937; }
    textarea { width: 100%; height: 70px; resize: none; margin: 12px 0 8px; padding: 8px; box-sizing: border-box; border: 1px solid #d1d5db; border-radius: 6px; line-height: 1.5; }
    .hint-box { font-size: 12px; color: #4b5563; background: #f3f4f6; padding: 8px; border-radius: 4px; margin-bottom: 12px; line-height: 1.4; border-left: 3px solid #3b82f6; }
    .hint-box code { color: #2563eb; font-weight: 700; font-family: monospace; }
    button { width: 100%; padding: 10px; border: none; cursor: pointer; border-radius: 6px; font-weight: 600; font-size: 14px; transition: all 0.2s; }
    .btn-start { background: #2563eb; color: white; }
    .btn-start:hover { background: #1d4ed8; }
    .btn-stop { background: #ef4444; color: white; }
    .btn-stop:hover { background: #dc2626; }
    .btn-options { background: #e5e7eb; color: #374151; margin-top: 10px; }
    .btn-options:hover { background: #d1d5db; }
    .btn-muted { background: #f3f4f6; color: #374151; margin-top: 8px; }
    .btn-muted:hover { background: #e5e7eb; }
    #logBox { margin-top: 15px; padding: 10px; background: #1e293b; color: #10b981; border-radius: 6px; height: 140px; overflow-y: auto; font-size: 12px; font-family: Consolas, monospace; line-height: 1.5; }
  </style>
</head>
<body>
  <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;">
    <h3>Web Agent</h3>
    <span id="statusBadge" style="padding:4px 8px;border-radius:4px;background:#e5e7eb;color:#374151;font-size:12px;font-weight:700;">状态：空闲</span>
  </div>

  <textarea id="taskInput" placeholder="例如：根据我的简历帮我填写当前公司的投递表单"></textarea>

  <div class="hint-box">
    输入“填写当前求职表单”会进入专门的填表模式。普通任务仍支持 <code>{{name}}</code> 这类知识库占位符。
  </div>

  <div style="display:flex;gap:10px;margin-bottom:10px;">
    <button id="startBtn" class="btn-start" style="flex:1;">开始</button>
    <button id="stopBtn" class="btn-stop" style="flex:1;">停止</button>
  </div>

  <div id="hitlControls" style="display:none;flex-direction:column;gap:8px;margin-bottom:10px;padding:10px;background:#fee2e2;border:1px solid #fca5a5;border-radius:6px;">
    <div style="font-size:12px;color:#dc2626;font-weight:700;margin-bottom:4px;">Agent 已挂起，等待人工协助</div>
    <button id="popupResumeBtn" style="padding:8px;background:#2563eb;color:white;border:none;border-radius:4px;cursor:pointer;font-weight:700;font-size:13px;">我已处理，恢复执行</button>
    <button id="popupAbortBtn" style="padding:8px;background:#fff;color:#4b5563;border:1px solid #d1d5db;border-radius:4px;cursor:pointer;font-size:13px;">终止任务，我来接管</button>
  </div>

  <button id="updateKnowledgeBtn" class="btn-muted">更新知识库（当前表单）</button>
  <button id="optionsBtn" class="btn-options">配置 API、知识库和简历</button>

  <div id="logBox">> 系统就绪...<br></div>

  <script src="popup.js"></script>
</body>
</html>
