<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 330px; padding: 16px; font-family: Arial, sans-serif; color: #222; }
    h3 { margin: 0 0 12px; font-size: 18px; }
    textarea { width: 100%; height: 76px; resize: none; margin-bottom: 10px; padding: 8px; box-sizing: border-box; border: 1px solid #ccd0d5; border-radius: 4px; line-height: 1.45; }
    button { width: 100%; padding: 10px; background: #1677ff; color: white; border: none; cursor: pointer; border-radius: 4px; font-weight: 700; margin-top: 8px; }
    button:hover { background: #4096ff; }
    .btn-options { background: #f0f2f5; color: #222; }
    .btn-options:hover { background: #e5e7eb; }
    .hint { font-size: 12px; color: #666; line-height: 1.45; margin-bottom: 8px; }
    #logBox { margin-top: 14px; padding: 10px; background: #20242c; color: #d0d5dd; border-radius: 4px; height: 145px; overflow-y: auto; font-size: 12px; font-family: Consolas, monospace; line-height: 1.45; }
  </style>
</head>
<body>
  <h3>Web Agent</h3>
  <div class="hint">输入“帮我填写当前求职表单”会进入专门的填表模式，填完会停在提交前。</div>
  <textarea id="taskInput" placeholder="例如：根据我的简历帮我填写当前公司的投递表单"></textarea>
  <button id="startBtn">开始执行</button>
  <button id="updateKnowledgeBtn" class="btn-options">更新知识库（当前表单）</button>
  <button id="optionsBtn" class="btn-options">配置 API、知识库和简历</button>

  <div id="logBox">&gt; 系统就绪...<br></div>

  <script src="popup.js"></script>
</body>
</html>
